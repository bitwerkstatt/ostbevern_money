# CI-Workflow und Veröffentlichung für Ostbevern Money.
#
# Ablauf: Die Jobs `pipeline` und `app` prüfen jeden Push und jeden Pull Request. Der Job
# `app` baut die Seite, startet den Smoke-Test (Playwright und axe, QUAL-02) gegen den Build
# und lädt das Ergebnis nur bei einem Push oder manuellen Start auf `main` als
# Pages-Artefakt hoch. Der Job `deploy` veröffentlicht dieses Artefakt auf GitHub Pages (D-09).
# Er braucht beide Jobs, läuft nie für Pull Requests oder andere Branches als `main` und ist der
# einzige Job mit Schreibrechten für Pages und den OIDC-Token (least privilege).
#
# Hinweis (D-10): Es gibt noch kein GitHub-Remote. Der Workflow läuft erst, wenn die Nutzerin
# bzw. der Nutzer das öffentliche Repository `ostbevern-money` anlegt und `main` pusht; die
# Schritte stehen im README (Abschnitt „Veröffentlichung auf GitHub Pages“).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: uv einrichten
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.26"
      - name: Abhängigkeiten installieren
        run: uv sync --locked
      - name: Ruff-Lint
        run: uv run ruff check .
      - name: Ruff-Formatierungsprüfung
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
      - name: Pipeline reproduzierbar (D-24)
        working-directory: ${{ github.workspace }}
        run: |
          uv run --directory pipeline python alle.py
          git diff --stat --exit-code -- daten app/src/data
          if [ -n "$(git status --porcelain --untracked-files=all -- daten app/src/data)" ]; then
            git status --porcelain --untracked-files=all -- daten app/src/data
            exit 1
          fi
          # Schritt 08 rendert nur fehlende Belegseiten (RESEARCH Pitfall 2): Alle Bilder
          # müssen eingecheckt sein. Die WebP-Bytes werden bewusst nicht verglichen, weil
          # PDFium und libwebp je Plattform andere Bytes liefern können; geprüft wird nur, dass
          # alle.py unter app/public/quellen keine Datei neu anlegt oder ändert.
          if [ -n "$(git status --porcelain --untracked-files=all -- app/public/quellen)" ]; then
            git status --porcelain --untracked-files=all -- app/public/quellen
            exit 1
          fi

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Typprüfung (vue-tsc)
        run: npm run type-check
      - name: ESLint
        run: npm run lint
      - name: Prettier-Prüfung
        run: npm run format:check
      - name: Tests (vitest)
        run: npm run test
      - name: Build
        run: npm run build
      - name: Playwright-Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: Smoke-Test (Playwright + axe)
        run: npm run test:e2e
      - name: Seite für GitHub Pages hochladen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Relativ zum Workspace: Die `working-directory` des Jobs gilt nicht für `with`.
          path: app/dist

  deploy:
    needs: [pipeline, app]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
